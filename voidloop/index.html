<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voidloop — Mining Roguelite</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #0a0a0a;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      user-select: none;
    }
    canvas { display: block; }

    /* HUD Container */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: none;
    }

    /* Top-left: HP + Coins */
    .hud-topleft {
      position: absolute;
      top: 12px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hp-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hp-heart {
      font-size: 22px;
      filter: drop-shadow(0 0 4px rgba(239,68,68,0.6));
    }
    .hp-bar-wrapper {
      width: 120px;
      height: 14px;
      background: rgba(0,0,0,0.5);
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .hp-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #ef4444, #f87171);
      border-radius: 7px;
      transition: width 0.2s;
      box-shadow: 0 0 8px rgba(239,68,68,0.4);
    }
    .hp-text {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.8);
      margin-top: 2px;
    }
    .coin-display {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 18px;
      font-weight: 800;
    }
    .coin-icon { font-size: 20px; filter: drop-shadow(0 0 4px rgba(251,191,36,0.5)); }
    .coin-rate {
      font-size: 13px;
      color: #4ade80;
      font-weight: 600;
    }

    /* Top-center: Floor + Exit */
    .hud-topcenter {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    #floor-indicator {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      color: #fff;
    }
    #exit-open {
      display: none;
      font-size: 18px;
      font-weight: 900;
      color: #4ade80;
      text-shadow: 0 0 12px rgba(74,222,128,0.6);
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }

    /* Top-right: Timer + Stats */
    .hud-topright {
      position: absolute;
      top: 12px;
      right: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    #timer-display {
      font-size: 20px;
      font-weight: 800;
      font-family: monospace;
      color: #fbbf24;
      text-shadow: 0 0 8px rgba(251,191,36,0.4);
    }
    .stat-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
    }
    .stat-icon { font-size: 16px; }

    /* Crosshair */
    .crosshair {
      position: fixed;
      top: 50%; left: 50%;
      width: 12px; height: 12px;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255,255,255,0.7);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
    }
    .crosshair::after {
      content: ''; position: absolute;
      top: 50%; left: 50%;
      width: 2px; height: 2px;
      background: #fff;
      transform: translate(-50%, -50%);
      border-radius: 50%;
    }

    /* Weapon hotbar */
    #hotbar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
      pointer-events: auto;
    }
    .hotbar-slot {
      width: 56px; height: 56px;
      background: rgba(0,0,0,0.6);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }
    .hotbar-slot.active {
      border-color: #a855f7;
      box-shadow: 0 0 16px rgba(168,85,247,0.5);
      background: rgba(168,85,247,0.2);
    }
    .hotbar-slot .slot-key {
      position: absolute;
      top: 2px; left: 4px;
      font-size: 10px;
      opacity: 0.6;
      font-weight: 700;
    }

    /* Damage numbers */
    .damage-number {
      position: fixed;
      font-size: 20px;
      font-weight: 900;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 20;
      animation: floatUp 1s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.2); }
    }

    /* Floating loot text */
    .floating-loot {
      position: fixed;
      font-size: 18px;
      font-weight: 900;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 20;
      white-space: nowrap;
    }

    /* FPS counter */
    #fps-display {
      position: fixed;
      bottom: 20px;
      left: 20px;
      font-size: 12px;
      font-family: monospace;
      color: rgba(255,255,255,0.5);
      background: rgba(0,0,0,0.4);
      padding: 4px 8px;
      border-radius: 6px;
      pointer-events: none;
      z-index: 10;
    }

    /* Slider controls panel */
    #slider-controls {
      position: fixed;
      bottom: 80px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }
    .slider-control {
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 10px 14px;
      display: none;
      flex-direction: column;
      gap: 6px;
      min-width: 120px;
    }
    .slider-control input[type=range] {
      width: 100%;
      accent-color: #a855f7;
    }

    /* Loading screen */
    #loading {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      gap: 16px;
    }
    #loading h1 { font-size: 32px; letter-spacing: 4px; }
    #loading-bar {
      width: 300px; height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
    }
    #loading-bar-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #a855f7, #22c55e);
      transition: width 0.3s;
    }

    /* Camp UI */
    #camp-ui {
      position: fixed;
      inset: 0;
      background: rgba(5,5,10,0.97);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 40px;
      overflow-y: auto;
    }
    #camp-ui.active { display: flex; }
    .camp-title { font-size: 36px; margin-bottom: 8px; }
    .camp-subtitle { opacity: 0.6; margin-bottom: 32px; }
    .camp-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      max-width: 900px;
      width: 100%;
    }
    .camp-panel {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .camp-panel h3 {
      margin-bottom: 12px;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .upgrade-btn {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      text-align: left;
      font-size: 13px;
      transition: all 0.15s;
    }
    .upgrade-btn:hover:not(:disabled) {
      background: rgba(168,85,247,0.2);
      border-color: #a855f7;
    }
    .upgrade-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    #btn-descend {
      margin-top: 32px;
      padding: 14px 48px;
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(90deg, #a855f7, #7c3aed);
      border: none;
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    #btn-descend:hover {
      transform: scale(1.05);
      box-shadow: 0 0 24px rgba(168,85,247,0.5);
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <h1>VOIDLOOP</h1>
    <div id="loading-bar"><div id="loading-bar-fill"></div></div>
    <div id="loading-text" style="opacity:0.6">Loading assets...</div>
  </div>

  <div id="hud">
    <!-- Top-left: HP + Coins -->
    <div class="hud-topleft">
      <div class="hp-container">
        <span class="hp-heart">❤️</span>
        <div>
          <div class="hp-bar-wrapper"><div class="bar-fill hp-fill" id="hp-bar" style="width:100%"></div></div>
          <div class="hp-text" id="hp-text">100/100</div>
        </div>
      </div>
      <div class="coin-display">
        <span class="coin-icon">🪙</span>
        <span id="coin-display">0</span>
        <span class="coin-rate" id="coin-rate">+0</span>
      </div>
    </div>

    <!-- Top-center: Floor + Exit -->
    <div class="hud-topcenter">
      <div id="floor-indicator" style="display:none;">FLOOR 1</div>
      <div id="exit-open">EXIT OPEN!</div>
    </div>

    <!-- Top-right: Timer + Stats -->
    <div class="hud-topright">
      <div id="timer-display">00:00</div>
      <div class="stat-row">
        <span class="stat-icon">⭐</span>
        <span id="level-display">1</span>
      </div>
      <div class="stat-row">
        <span class="stat-icon">💀</span>
        <span id="kills-display">0</span>
      </div>
    </div>
  </div>

  <div class="crosshair" id="crosshair" style="display:none;"></div>

  <div id="fps-display" style="display:none;">-- FPS</div>

  <div id="slider-controls">
    <div class="slider-control" id="brightness-control">
      <div style="font-size:11px; text-align:center; opacity:0.7;">Brightness</div>
      <input type="range" id="brightness-slider" min="0.2" max="3.0" step="0.1" value="1.0">
    </div>
    <div class="slider-control" id="zoom-control">
      <div style="font-size:11px; text-align:center; opacity:0.7;">Zoom</div>
      <input type="range" id="zoom-slider" min="0.3" max="3.0" step="0.1" value="1.0">
    </div>
  </div>

  <div id="hotbar" style="display:none;">
    <div class="hotbar-slot active" data-slot="0"><span class="slot-key">1</span>⛏</div>
    <div class="hotbar-slot" data-slot="1"><span class="slot-key">2</span>⚔</div>
    <div class="hotbar-slot" data-slot="2"><span class="slot-key">3</span>🔫</div>
    <div class="hotbar-slot" data-slot="3"><span class="slot-key">4</span>💣</div>
  </div>

  <div id="camp-ui">
    <div class="camp-title">🏕️ Camp</div>
    <div class="camp-subtitle">Upgrade your gear before the next descent</div>
    <div class="camp-grid">
      <div class="camp-panel">
        <h3>⛏ Blacksmith</h3>
        <div id="blacksmith-upgrades"></div>
      </div>
      <div class="camp-panel">
        <h3>⚔ Combat</h3>
        <div id="combat-upgrades"></div>
      </div>
      <div class="camp-panel">
        <h3>🔮 Spirit</h3>
        <div id="spirit-upgrades"></div>
      </div>
    </div>
    <button id="btn-descend">DESCEND</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
