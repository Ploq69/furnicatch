<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voidloop — Sound Effect Picker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #151520;
      border-bottom: 1px solid #2a2a3a;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    header h1 { font-size: 18px; color: #a855f7; letter-spacing: 1px; }
    header .stats { font-size: 12px; color: #888; }
    header .actions { display: flex; gap: 8px; }
    button {
      background: #2a2a3a;
      border: 1px solid #3a3a4a;
      color: #e0e0e0;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.15s;
    }
    button:hover { background: #3a3a4a; border-color: #a855f7; }
    button.primary { background: #a855f7; border-color: #a855f7; color: #fff; }
    button.primary:hover { background: #9333ea; }
    button.danger { background: #ef4444; border-color: #ef4444; color: #fff; }
    .main { display: flex; flex: 1; overflow: hidden; }

    /* Left panel — Events */
    .panel-left {
      width: 380px;
      background: #111118;
      border-right: 1px solid #2a2a3a;
      display: flex;
      flex-direction: column;
    }
    .panel-left .search {
      padding: 10px 14px;
      border-bottom: 1px solid #2a2a3a;
    }
    .panel-left input {
      width: 100%;
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      color: #e0e0e0;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
    }
    .panel-left input:focus { outline: none; border-color: #a855f7; }
    .events-list { flex: 1; overflow-y: auto; padding: 8px; }
    .event-card {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .event-card:hover { border-color: #a855f7; }
    .event-card.active { border-color: #a855f7; background: #1f1f2e; }
    .event-card .event-name {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    .event-card .event-desc {
      font-size: 11px;
      color: #888;
      margin-bottom: 6px;
    }
    .slots {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .slot {
      background: #2a2a3a;
      border: 1px dashed #3a3a4a;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 10px;
      color: #888;
      min-width: 60px;
      text-align: center;
    }
    .slot.filled {
      background: #2d1f3d;
      border-style: solid;
      border-color: #a855f7;
      color: #d8b4fe;
    }

    /* Right panel — Sound browser */
    .panel-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0d0d14;
    }
    .panel-right .toolbar {
      padding: 10px 14px;
      border-bottom: 1px solid #2a2a3a;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .panel-right .toolbar select {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      color: #e0e0e0;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
    }
    .panel-right .toolbar input {
      flex: 1;
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      color: #e0e0e0;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
    }
    .panel-right .toolbar input:focus { outline: none; border-color: #a855f7; }
    .sounds-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 14px;
    }
    .sound-group {
      margin-bottom: 12px;
    }
    .sound-group h3 {
      font-size: 11px;
      text-transform: uppercase;
      color: #a855f7;
      letter-spacing: 1px;
      margin-bottom: 6px;
      padding: 4px 0;
      border-bottom: 1px solid #2a2a3a;
    }
    .sound-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.1s;
      font-size: 12px;
    }
    .sound-item:hover { background: #1a1a24; }
    .sound-item .play-btn {
      width: 24px; height: 24px;
      padding: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      font-size: 10px;
      flex-shrink: 0;
    }
    .sound-item .sound-name { flex: 1; }
    .sound-item .sound-cat { color: #888; font-size: 10px; }
    .sound-item .add-btn {
      padding: 3px 10px;
      font-size: 10px;
    }

    /* Event detail editor */
    .editor {
      background: #151520;
      border-top: 1px solid #2a2a3a;
      padding: 14px;
      flex-shrink: 0;
    }
    .editor h3 {
      font-size: 14px;
      margin-bottom: 10px;
      color: #fff;
    }
    .editor .editor-slots {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .editor-slot {
      background: #1a1a24;
      border: 2px dashed #3a3a4a;
      border-radius: 8px;
      padding: 8px 12px;
      min-width: 180px;
      text-align: center;
      font-size: 12px;
    }
    .editor-slot.filled {
      border-style: solid;
      border-color: #a855f7;
      background: #2d1f3d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .editor-slot .remove-btn {
      padding: 2px 6px;
      font-size: 10px;
      background: #3a1a1a;
      border-color: #5a2a2a;
      color: #f87171;
    }
    .editor-slot .remove-btn:hover { background: #5a2a2a; }

    .toast {
      position: fixed;
      bottom: 20px; right: 20px;
      background: #22c55e;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <header>
    <h1>🔊 VOIDLOOP SFX PICKER</h1>
    <div class="stats" id="stats">Loading catalog...</div>
    <div class="actions">
      <button onclick="app.exportConfig()">⬇ Export JSON</button>
      <button class="primary" onclick="app.saveConfig()">💾 Save Config</button>
    </div>
  </header>

  <div class="main">
    <div class="panel-left">
      <div class="search">
        <input type="text" id="event-search" placeholder="Search events..." oninput="app.filterEvents(this.value)">
      </div>
      <div class="events-list" id="events-list"></div>
    </div>

    <div class="panel-right">
      <div class="toolbar">
        <select id="prefix-filter" onchange="app.filterSounds()">
          <option value="">All Prefixes</option>
        </select>
        <input type="text" id="sound-search" placeholder="Search sounds by name or category..." oninput="app.filterSounds()">
      </div>
      <div class="sounds-list" id="sounds-list"></div>
    </div>
  </div>

  <div class="editor" id="editor" style="display:none;">
    <h3 id="editor-title">Event</h3>
    <div class="editor-slots" id="editor-slots"></div>
  </div>

  <div class="toast" id="toast">Saved!</div>

  <script type="module" src="./sfx-picker.js"></script>
</body>
</html>
